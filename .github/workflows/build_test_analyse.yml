name: Build, Run Tests and Sonar Analysis
on:
  push:
    branches:
      - develop  # Trigger new analysis for each Merge/Push into the main-Branch (i.e. develop)
  pull_request:
    types: [opened, synchronize, reopened] # Trigger for each PR

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' #should use the same as in the docker file
          java-version: 21
          cache: 'maven'
          # cache-dependency-path: 'sub-project/pom.xml' # optional - seems to be deprecated
      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build, run tests and analyse
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Pcoverage -Dsonar.projectKey=eu.europeana.api:translation-api
        env:
          # Needed to get some information about the pull request, if any
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SonarCloud access token should be generated from https://sonarcloud.io/account/security/

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
